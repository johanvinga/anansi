name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            cd /opt/supplier-app
            git pull --ff-only origin main

            cd server
            npm ci
            npm run build
            npm run db:deploy
            sudo systemctl restart supplier-app

            cd ../client
            npm ci
            npm run build
            sudo systemctl reload nginx
