# Copy to /etc/nginx/sites-available/supplier-app on the VPS, then:
#   sudo ln -s /etc/nginx/sites-available/supplier-app /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# After certbot runs with --nginx it will add the 443 listener and redirect to this file.
server {
    listen 80;
    server_name winwintrading.live;

    root /opt/supplier-app/client/dist;
    index index.html;

    # Must exceed MAX_UPLOAD_MB (25) to allow PDF uploads through the proxy.
    client_max_body_size 30m;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback for react-router routes.
    location / {
        try_files $uri /index.html;
    }
}
