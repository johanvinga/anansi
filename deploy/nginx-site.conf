# Obtain a certificate for winwintrading.live before enabling this configuration.
# Copy to /etc/nginx/sites-available/supplier-app, enable the site, then run
# nginx -t and reload nginx. Renew the certificate before it expires.
server {
    listen 80;
    server_name winwintrading.live;

    location ^~ /api/ {
        default_type application/json;
        return 403 '{"error":{"code":"FORBIDDEN","message":"HTTPS is required.","details":[]}}';
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name winwintrading.live;
    ssl_certificate /etc/letsencrypt/live/winwintrading.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/winwintrading.live/privkey.pem;

    root /opt/supplier-app/client/dist;
    index index.html;
    client_max_body_size 30m;
    client_body_timeout 300s;

    location = /api/v1/public/catalogs {
        client_max_body_size 105m;
        error_page 413 = @catalog_upload_too_large;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location @catalog_upload_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"Request body is too large.","details":[]}}';
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
